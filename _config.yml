# Jekyll & Minimal Mistakes Theme Configuration
# Reference: https://mmistakes.github.io/minimal-mistakes/docs/configuration/

# Theme
minimal_mistakes_skin: 'default'

# Site Metadata
locale: 'ko-KR'
direction: 'ltr'
title: '초록'
title_separator: '|'
subtitle:
name: '초록'
description: '제4대 응용AI융합학부 학생회장단 선거운동본부 초록'
url: 'https://hwpxrk.github.io'
baseurl:
repository: 'hwpxrk/hwpxrk.github.io'
teaser:
logo: 'assets/src/green/logo/logo.png'
masthead_title:
breadcrumbs: false
words_per_minute: 50
enable_copy_code_button: false
copyright:
copyright_url:

# Comments
comments:
    provider: # false (default), "disqus", "discourse", "facebook", "staticman", "staticman_v2", "utterances", "giscus", "custom"
    disqus:
        shortname: # https://help.disqus.com/customer/portal/articles/466208-what-s-a-shortname-
    discourse:
        server: # https://meta.discourse.org/t/embedding-discourse-comments-via-javascript/31963 , e.g.: meta.discourse.org
    facebook:
        # https://developers.facebook.com/docs/plugins/comments
        appid:
        num_posts: # 5 (default)
        colorscheme: # "light" (default), "dark"
    utterances:
        theme: # "github-light" (default), "github-dark"
        issue_term: # "pathname" (default)
    giscus:
        repo_id: # Shown during giscus setup at https://giscus.app
        category_name: # Full text name of the category
        category_id: # Shown during giscus setup at https://giscus.app
        discussion_term: # "pathname" (default), "url", "title", "og:title"
        reactions_enabled: # '1' for enabled (default), '0' for disabled
        theme: # "light" (default), "dark", "dark_dimmed", "transparent_dark", "preferred_color_scheme"
        strict: # 1 for enabled, 0 for disabled (default)
        input_position: # "top", "bottom" # The comment input box will be placed above or below the comments
        emit_metadata: # 1 for enabled, 0 for disabled (default) # https://github.com/giscus/giscus/blob/main/ADVANCED-USAGE.md#imetadatamessage
        lang: # "en" (default)
        lazy: # true, false # Loading of the comments will be deferred until the user scrolls near the comments container.
    staticman:
        branch: # "master"
        endpoint: # "https://{your Staticman v3 API}/v3/entry/github/"

# reCaptcha
reCaptcha:
    siteKey:
    secret:

# ATOM Feed
atom_feed:
    path: # blank (default) uses feed.xml
    hide: # true, false (default)

# Search
search: true
search_full_content: true
search_provider: lunr

lunr:
    search_within_pages: # true, false (default)
algolia:
    application_id: # YOUR_APPLICATION_ID
    index_name: # YOUR_INDEX_NAME
    search_only_api_key: # YOUR_SEARCH_ONLY_API_KEY
    powered_by: # true (default), false
google:
    search_engine_id: # YOUR_SEARCH_ENGINE_ID
    instant_search: # false (default), true

# SEO
google_site_verification:
bing_site_verification:
naver_site_verification:
yandex_site_verification:
baidu_site_verification:

# Social Sharing
twitter:
    username:
facebook:
    username:
    app_id:
    publisher:
og_image: 'assets/src/green/logo/profile.png'
og_image_alt: '초록'
# For specifying social profiles
# - https://developers.google.com/structured-data/customize/social-profiles
social:
    type: 'Person'
    name:
    links:
        - 'https://instagram.com/hwpxrk_'
        - 'https://instagram.com/_igotcrushonyou'
        - 'https://instagram.com/s_s_kong_03'

# Analytics
analytics:
    provider: # false (default), "google", "google-universal", "google-gtag", "custom"
    google:
        tracking_id:
        anonymize_ip: # true, false (default)

# Site Author
author:
    name: '초록'
    avatar: 'assets/src/green/logo/profile.png'
    bio: '성균관대학교 제4대 응용AI융합학부 학생회장단 선거운동본부 초록'
    links:
        - label: '정후보'
          icon: 'fab fa-fw fa-instagram'
          url: 'https://instagram.com/hwpxrk_'
        - label: '산업인공지능전공 부후보'
          icon: 'fab fa-fw fa-instagram'
          url: 'https://instagram.com/hwpxrk_'
        - label: 'AI융합운영전공 부후보'
          icon: 'fab fa-fw fa-instagram'
          url: 'https://instagram.com/hwpxrk_'

# Site Footer
footer:
    links:
        - label: '정후보'
          icon: 'fab fa-fw fa-instagram'
          url: 'https://instagram.com/hwpxrk_'
        - label: '산업인공지능전공 부후보'
          icon: 'fab fa-fw fa-instagram'
          url: 'https://instagram.com/hwpxrk_'
        - label: 'AI융합운영전공 부후보'
          icon: 'fab fa-fw fa-instagram'
          url: 'https://instagram.com/hwpxrk_'
    since: '2026'

# Reading Files
include:
    - .htaccess
    - _pages
exclude:
    - '*.sublime-project'
    - '*.sublime-workspace'
    - vendor
    - .asset-cache
    - .bundle
    - .jekyll-assets-cache
    - .sass-cache
    - assets/js/plugins
    - assets/js/_main.js
    - assets/js/vendor
    - Capfile
    - CHANGELOG
    - config
    - Gemfile
    - Gruntfile.js
    - gulpfile.js
    - LICENSE
    - log
    - minimal-mistakes-jekyll.gemspec
    - node_modules
    - package.json
    - package-lock.json
    - Rakefile
    - README
    - tmp
    - /docs # ignore Minimal Mistakes /docs
    - /test # ignore Minimal Mistakes /test
keep_files:
    - .git
    - .svn
encoding: 'utf-8'
markdown_ext: 'markdown,mkdown,mkdn,mkd,md'

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
    input: GFM
    hard_wrap: false
    auto_ids: true
    footnote_nr: 1
    entity_output: as_char
    toc_levels: 1..6
    smart_quotes: lsquo,rsquo,ldquo,rdquo
    enable_coderay: false

# Sass/SCSS
sass:
    sass_dir: _sass
    style: compressed
    quiet_deps: true
    silence_deprecations: ['import']

# Outputting
permalink: /:categories/:title/
timezone: Asia/Seoul

# Pagination with jekyll-paginate
paginate: 5
paginate_path: /page:num/

# Pagination with jekyll-paginate-v2
# Reference: https://github.com/sverrirs/jekyll-paginate-v2/blob/master/README-GENERATOR.md#site-configuration
pagination:
    # Set enabled to true to use paginate v2
    # enabled: true
    debug: false
    collection: 'posts'
    per_page: 10
    permalink: '/page/:num/'
    title: ':title'
    limit: 0
    sort_field: 'date'
    sort_reverse: true
    category: 'posts'
    tag: ''
    locale: ''
    trail:
        before: 2
        after: 2

# Plugins (previously gems:)
plugins:
    - jekyll-paginate
    - jekyll-sitemap
    - jekyll-gist
    - jekyll-feed
    - jekyll-include-cache
    - jekyll-archives

# mimic GitHub Pages with --safe
whitelist:
    - jekyll-paginate
    - jekyll-sitemap
    - jekyll-gist
    - jekyll-feed
    - jekyll-include-cache
    - jekyll-archives

# Archives
category_archive:
    type: jekyll-archives
    path: /categories/
tag_archive:
    type: jekyll-archives
    path: /tags/
show_taxonomy: true
jekyll-archives:
    enabled:
        - categories
        - tags
    layouts:
        category: archive-taxonomy
        tag: archive-taxonomy
    permalinks:
        category: /categories/:name/
        tag: /tags/:name/

# HTML Compression: https://jch.penibelst.de/
compress_html:
    clippings: all
    ignore:
        envs: development

# Defaults
defaults:
    # _posts
    - scope:
          path: ''
          type: posts
      values:
          layout: single
          author_profile: false
          read_time: false
          comments: true
          share: true
          related: true
    # _pages
    - scope:
          path: ''
          type: pages
      values:
          layout: single
          author_profile: false
          read_time: false
          comments: false
          share: true
          related: false

date_format: '%Y. %m. %d.'
