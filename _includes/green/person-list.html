<div class="green-people-list">
    {% for person in include.people %}
    <a class="green-person" href="{{ person.instagram | escape }}" target="_blank" rel="noopener noreferrer">
        <span class="green-person-role">{{ person.role | escape }}</span>
        <h3>{{ person.name | escape }}<span class="green-sr-only"> 인스타그램 (새 창)</span></h3>
        <span class="green-person-major">{{ person.major | escape }}</span>
    </a>
    {% endfor %}
</div>
